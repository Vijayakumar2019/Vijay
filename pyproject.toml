[project]
name = "agent_eda"
version = "0.1.0"
description = "Agent_EDA using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.193.2,<1.0.0"
]

[project.scripts]
agent_eda = "agent_eda.main:run"
run_crew = "agent_eda.main:run"
train = "agent_eda.main:train"
replay = "agent_eda.main:replay"
test = "agent_eda.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
